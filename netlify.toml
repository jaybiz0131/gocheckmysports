# Netlify config for the GoCheckMySports site (gocheckmysports.com).
# This repo IS the project, so the config lives at the root and importing the repo into
# Netlify needs no extra settings: this file supplies the build command, publish directory,
# Python version, and headers. The generator (site_build.py) is standard-library only and
# builds site/publish/ deterministically from committed content.
[build]
  # Refresh the live-scores snapshot first (keyless league APIs; any fetch error falls
  # back to the committed snapshot instead of failing the deploy), then build.
  # Pillow first: site_build.py renders the share card, the home-screen icon, and a
  # per-article Open Graph card at build time. The "|| true" keeps a package-index
  # hiccup from failing the deploy; without Pillow the card render falls open to the
  # committed assets, so the site still ships, just without per-article cards.
  command = "pip install --quiet Pillow || true; python3 scores_pulse.py || true; python3 site_build.py"
  publish = "site/publish"

[build.environment]
  PYTHON_VERSION = "3.12"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# SHARE CARDS ARE IMMUTABLE, SO LET THEM BE CACHED (2026-08-30). These live at the root
# and under /og/, so neither was covered by the /assets/* rule above and both fell
# through to the site default of "max-age=0, must-revalidate". Every link previewer
# (iMessage, Slack, WhatsApp, Twitter) was therefore forced to re-fetch and revalidate
# the card on every single share, and a previewer that does not get the image quickly
# just renders the link with no card at all. The page card never changes between
# redesigns and a per-article card never changes at all once its story is written.
[[headers]]
  for = "/og-image.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/og/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
