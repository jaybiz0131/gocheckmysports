# Self-verification for the GoCheckMySports pipeline.
#
# Two jobs, two layers:
#   canary  - Layer 1, OFFLINE, HARD GATE. No network, no API key. Fails the workflow
#             (blocks promotion) if the pipeline is mis-wired, the hype/dedupe belts drift,
#             the offline replay end-to-end breaks, or any fail-closed gate stops holding.
#   sources - Layer 2, LIVE fetch, NOTIFY-ONLY. Fetches each configured RSS feed and checks
#             HTTP 200 + feed shape. A broken feed (exit 3) fails THIS job (red check + opens
#             an issue) but never blocks anything. A network error is a soft warning.
name: Verify sports pipeline

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 6 * * 1"   # weekly, Monday 06:23 UTC
  workflow_dispatch: {}

jobs:
  canary:
    name: Layer 1 canary (offline hard gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Run offline canary (blocks on failure)
        run: python3 verify_pipeline.py canary

  sources:
    name: Layer 2 source check (notify, non-blocking)
    # Schedule/manual only (2026-07-21): running this on every push meant every busy
    # dev day emailed the owner once per push for the same known runner-IP feed blocks.
    # Pushes keep the Layer 1 hard gate; live-feed health is a weekly signal.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Check RSS feeds resolve (live)
        run: python3 verify_pipeline.py sources
      - name: Open or update the broken-feed issue (names the feeds)
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const title = "GoCheckMySports source feed check failed";
            let detail = "The failure list was not written; see the run log.";
            try {
              const fails = JSON.parse(fs.readFileSync("out/layer2_failures.json", "utf8"));
              detail = fails.map(f => "- **" + f.feed + "**: " + f.status + " (" + f.fallback + ")\n  " + f.url).join("\n");
            } catch (e) {}
            const runUrl = context.serverUrl + "/" + context.repo.owner + "/" + context.repo.repo + "/actions/runs/" + context.runId;
            const body = [
              "Layer 2 source verification failed for these configured feeds:",
              "", detail, "",
              "Run: " + runUrl, "",
              "This did NOT block anything. A 202 with a failing fallback usually means a",
              "runner-IP bot challenge; a persistent non-202 failure means the feed moved or died.",
              "Update or replace the feed URL in config.json, then close this issue."
            ].join("\n");
            const { owner, repo } = context.repo;
            const existing = await github.rest.issues.listForRepo({
              owner, repo, state: "open", labels: "sports-pipeline" });
            const open = existing.data.find(i => i.title === title);
            if (open) {
              // A repeat failure adds its detail instead of vanishing behind the open issue.
              await github.rest.issues.createComment({ owner, repo, issue_number: open.number, body });
            } else {
              await github.rest.issues.create({ owner, repo, title, body, labels: ["sports-pipeline"] });
            }
