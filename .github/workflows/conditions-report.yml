# The conditions report job (Program 7; Sprint S-2b item 3, 14 October 2026).
#
# The desk's one piece a day: conditions_report.py reads the week board and the conditions
# Worker, writes the report from the numbers (no model, no key, no spend), runs its own gate
# (the copy law, no picks, every number its game's own), and this job commits the one report
# file and pushes it. The push builds the site, so each run is one of the day's twelve builds.
#
# THE THREE RUNS, in UTC with the ET they land at (EDT until 1 November, then an hour earlier):
#   Thursday 11:17   7:17 AM EDT   the week's report; the NWS hourly product reaches Sunday
#   Saturday 21:17   5:17 PM EDT   the refresh for Saturday night and Sunday
#   Sunday   10:17   6:17 AM EDT   the refresh before the Sunday games. Early on purpose: the
#                                  scheduler has been measured 1.5 to 4 hours late on this family,
#                                  and a late run must still land before the 12:30 PM ET freeze.
#                                  conditions_report.py refuses to publish inside the freeze.
# EACH RUN HAS TWO CATCH-UPS (15 October 2026). GitHub delivered NO run at all for the Thursday
# 11:17 UTC primary (the workflow has no run on record at 9:00 AM EDT, failed or otherwise).
# conditions_report.py publishes a slot once (<date>-<slot>.json exists: "already published", exit 0,
# no commit, no build pushed), so the extra crons cost nothing when the primary lands.
# Odd minutes on purpose: GitHub's scheduler drifts worst on :00 and :30.
name: Conditions report

on:
  schedule:
    - cron: "17 11 * * 4"     # Thursday 11:17 UTC
    - cron: "47 12 * * 4"     #   catch-up, 8:47 AM EDT
    - cron: "17 14 * * 4"     #   catch-up, 10:17 AM EDT
    - cron: "17 21 * * 6"     # Saturday 21:17 UTC
    - cron: "47 22 * * 6"     #   catch-up, 6:47 PM EDT
    - cron: "47 23 * * 6"     #   catch-up, 7:47 PM EDT
    - cron: "17 10 * * 0"     # Sunday 10:17 UTC
    - cron: "17 11 * * 0"     #   catch-up, 7:17 AM EDT
    - cron: "17 12 * * 0"     #   catch-up, 8:17 AM EDT; conditions_report.py refuses inside the freeze
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: conditions-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - name: Pillow, for the share card the build draws
        run: pip install --quiet Pillow
      - name: Write the report (its gate runs inside; a red gate publishes nothing)
        run: python3 conditions_report.py --publish
      - name: The build is the second gate
        run: |
          set +e
          python3 site_build.py > "$RUNNER_TEMP/build.log" 2>&1
          rc=$?
          tail -n 30 "$RUNNER_TEMP/build.log"
          if [ "$rc" != "0" ]; then echo "build exited $rc; nothing pushed"; exit "$rc"; fi
      - name: Commit the report and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/reports/conditions
          git diff --cached --quiet && { echo "no new report"; exit 0; }
          git commit -m "conditions report: $(date -u +%Y-%m-%dT%H:%MZ)"
          ok=false
          for i in 1 2 3; do
            if git push; then ok=true; break; fi
            echo "::warning::push rejected (attempt $i); rebasing"
            git pull --rebase --autostash origin main || {
              echo "rebase conflicted"; git rebase --abort || true; exit 1; }
          done
          [ "$ok" = true ] || { echo "push failed after 3 attempts"; exit 1; }
