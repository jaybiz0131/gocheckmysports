# Issue janitor: dispatch-only, closes STALE auto-opened pipeline issues so the next
# real alarm opens fresh instead of commenting on an old thread (owner fix list
# 2026-08-18, hygiene). Never runs on a schedule; the owner triggers it from the
# Actions tab after a fix wave supersedes the old alarms.
#
# It closes ONLY issues whose title starts with one of the known auto-alarm classes
# AND that were created before the cutoff. It never touches the kill-streak digests
# (a human ruling queue), the ops ledger, the calendar queue, or anything a human
# opened by hand.
name: Issue janitor (close stale auto-alarms)

on:
  # C-5 (2026-09-17): DAILY, not dispatch only. The janitor closes stale
  # auto-alarm issues, and dispatch-only meant alarms piled up until someone
  # remembered it. An issue list nobody can read is the same problem as an
  # Actions page nobody can read.
  schedule:
    - cron: "40 7 * * *"
  workflow_dispatch:
    inputs:
      cutoff:
        description: "Close matching auto-issues created BEFORE this date (YYYY-MM-DD)"
        type: string
        default: "2026-08-18"

permissions:
  issues: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Close stale auto-alarms
        uses: actions/github-script@v9
        with:
          script: |
            // C-5: ON A CRON THIS CLOSED NOTHING. inputs.cutoff is empty on a
            // schedule event, and an empty string makes `i.created_at >= cutoff`
            // true for every issue, so every one was skipped. The janitor ran, said
            // "0 stale auto-alarm(s) closed" and looked like it was working.
            //
            // Unsupplied, the cutoff is seven days ago: an auto-alarm older than a
            // week either was fixed or is not being read, and a recurrence opens a
            // fresh issue either way.
            const supplied = "${{ inputs.cutoff }}";
            const cutoff = supplied || new Date(Date.now() - 7 * 864e5)
              .toISOString().slice(0, 10);
            console.log(`janitor: closing auto-alarms created before ${cutoff}`);
            const CLASSES = [
              "Edition stage failed:",
              "Edition gap:",
              "Missed edition:",
              "Desk run failed:",
              "source feed check failed"
            ];
            const { owner, repo } = context.repo;
            const open = await github.paginate(github.rest.issues.listForRepo,
              { owner, repo, state: "open", per_page: 100 });
            let closed = 0;
            for (const i of open) {
              if (i.pull_request) continue;
              const auto = CLASSES.some(c => i.title.includes(c));
              if (!auto) continue;
              if (i.created_at >= cutoff) continue;
              await github.rest.issues.createComment({ owner, repo, issue_number: i.number,
                body: `Closed by the issue janitor: an auto-alarm older than the ${cutoff} cutoff. These are machine-written and self-clearing; the condition either was fixed or is no longer being reported. A recurrence opens a fresh issue.` });
              await github.rest.issues.update({ owner, repo, issue_number: i.number, state: "closed" });
              console.log(`closed #${i.number}: ${i.title}`);
              closed++;
            }
            console.log(`${closed} stale auto-alarm(s) closed (cutoff ${cutoff})`);
