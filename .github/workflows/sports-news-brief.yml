# GoCheckMySports news brief: the scheduled ingest -> AI processing -> review queue job.
#
# Runs aggregate -> editor -> verifier -> writer -> digest on the slot schedule and uploads
# the review queue as a workflow artifact for the human editor-in-chief to approve.
#
# FAIL-CLOSED and it NEVER PUBLISHES. It runs run.py (Stages 1-5) only; publish.py (Stage 6)
# is a separate, deliberate, human-approved step and is intentionally not invoked here. If any
# stage errors, run.py exits non-zero and this job goes red (flagging a human); nothing is
# pushed anywhere.
#
# The pipeline needs ANTHROPIC_API_KEY (repo secret) for the editor/verifier/writer calls.
# If the key is not configured yet, the job runs the offline canary as a wiring smoke test
# and stops (green) instead of failing daily.
name: GoCheckMySports daily brief

on:
  schedule:
    # THREE-SLOT DAY (owner directive 2026-07-14, Eastern audience clock): the flagship
    # cadence. Later slots prefer updating/extending the day over repeating it (editor
    # prompt + deterministic dedup guard). Crons drift 1h later on Jack's clock when DST
    # ends Nov 1.
    # Odd minutes on purpose: GitHub's scheduler drifts worst on :00/:30 (observed slots
    # firing 3-7 hours late). The watcher's slot-recovery re-fires any slot that still
    # misses its deadline.
    # Morning-first slots (owner directive 2026-07-21): content lands before the
    # commute, refreshes late morning, wraps in the evening. Keep this list in sync
    # with SLOT_DEADLINES in watcher.py, and keep each cron inside its edition's UTC
    # window (wrap.py derives the edition from the hour: morning < 14:00 UTC,
    # midday 14:00-20:00, evening 20:00-24:00).
    - cron: "40 9 * * *"    # Morning Brief slot, 09:40 UTC = 5:40am Eastern
    - cron: "38 15 * * *"   # Midday Update slot, 15:38 UTC = 11:38am Eastern
    - cron: "38 23 * * *"   # Evening Wrap slot, 23:38 UTC = 7:38pm Eastern
    # RETRY TICKS (2026-07-21: the midday slot drifted 4.7h and the whole afternoon
    # went dark). Each retry is inside its slot's edition window and COST-NEUTRAL:
    # the slot guard below stands the run down before any model call when the slot's
    # edition already exists, so a retry only spends when the primary was skipped or
    # failed. The evening slot has no retry (its window ends at midnight; the
    # watcher's 23:48 recovery covers it).
    - cron: "55 10 * * *"   # Morning retry
    - cron: "10 17 * * *"   # Midday retry
    - cron: "25 11 * * *"   # Second morning retry: the morning cycle must be live before 12:00 UTC
  workflow_dispatch: {}
  # the breaking-news watcher (watcher.yml) calls this workflow with breaking=true
  workflow_call:
    inputs:
      breaking:
        type: boolean
        default: false
      # the edition slug a slot-recovery fire is for; wrap.py regenerates exactly this
      # slot instead of resolving one from the wall clock (empty = resolve normally)
      slot:
        type: string
        default: ""

# PUBLISH LOCK (directive item 9): one publish at a time per repo. The group is shared
# with the watcher's breaking runs, so a breaking run QUEUES behind an in-flight scheduled
# run instead of racing its push (the Pet-divergence class, prevented structurally).
concurrency:
  group: sports-publish
  cancel-in-progress: false

permissions:
  contents: write   # autopilot commits auto-approved VERIFIED stories into site/content
  issues: write     # deploy_check opens a flag issue if a push never deploys

jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      # CHECK OUT THE BRANCH TIP, NOT THE TRIGGER SHA (duplicate root cause 2026-08-25).
      # Bare checkout pins github.sha, the commit the run was SCHEDULED against. The
      # publish jobs share a concurrency group so runs queue, and a queued run can start
      # an hour after it was triggered: it then judges its duplicate guards against an
      # hour-stale corpus, cannot see the story a sibling run just published, and the
      # push step's rebase-retry lands the second copy without re-running any guard.
      # That is how one CIA-Moscow story published twice 83 minutes apart. ref: main
      # makes every run judge against the corpus as of run START, which with queueing
      # is complete.
      - uses: actions/checkout@v7
        with: { ref: main }
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }

      # The pipeline itself is stdlib-only; Pillow is the one optional extra, used by
      # the share-card render exactly as the Netlify build uses it (fix list 2026-08-18).
      # Fail-open: no Pillow just means cards are skipped, exactly like production.
      - name: Optional deps (OG card rendering, matches the Netlify build)
        run: pip install --quiet Pillow || true

      - name: Offline canary (hard gate, blocks a mis-wired pipeline)
        run: python3 verify_pipeline.py canary

      - name: Detect whether the API key is configured
        id: key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "have_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "have_key=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ANTHROPIC_API_KEY not set; ran the offline canary only. Add the secret to enable the live daily brief."
          fi

      # SLOT GUARD: on schedule ticks (primary or retry), if this slot's edition is
      # already on disk the day is served and the run stands down before any model
      # call. Manual dispatch always runs; breaking runs always run (they regenerate
      # the slot edition on purpose); watcher recovery fires only when the edition is
      # missing, so it always passes.
      - name: Slot guard (a retry tick stands down when the slot is already served)
        id: guard
        env:
          EVENT: ${{ github.event_name }}
          BREAKING: ${{ inputs.breaking == true && '1' || '0' }}
        run: |
          python3 - <<'PYEOF'
          import datetime, os
          serve = "true"
          if os.environ.get("EVENT") == "schedule" and os.environ.get("BREAKING") != "1":
              now = datetime.datetime.now(datetime.timezone.utc)
              slug = ("morning-brief" if now.hour < 14 else
                      "afternoon-brief" if now.hour < 20 else "evening-brief")
              if os.path.exists(os.path.join("site", "content",
                                             f"{now.date().isoformat()}-{slug}.json")):
                  serve = "false"
                  print(f"::notice::Slot guard: {slug} is already published today; "
                        f"standing down before any model call (retry ticks are free "
                        f"when the primary served the slot).")
          open(os.environ["GITHUB_OUTPUT"], "a").write(f"serve={serve}\n")
          PYEOF

      - name: Run the daily brief (live; Stages 1-5 only, never publishes)
        if: steps.key.outputs.have_key == 'true' && steps.guard.outputs.serve == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 run.py --mode live

      # FULL AUTO RELEASE (Jack's standing instruction, 2026-07-11): the adversarial verifier
      # is the gate. VERIFIED stories auto-publish; NEEDS-HUMAN-REVIEW stays queued for a
      # human take; REJECT never ships. The push below auto-deploys via Netlify.
      - name: Autopilot publish of VERIFIED stories
        if: steps.key.outputs.have_key == 'true' && steps.guard.outputs.serve == 'true'
        env:
          # breaking runs enforce the additive two-source gate (single-source holds unless
          # headline-labeled unconfirmed); scheduled runs pass '0'
          BREAKING: ${{ inputs.breaking == true && '1' || '0' }}
        run: python3 autopilot.py

      # The day's known major events must have coverage; a gap warns the editor the
      # same day instead of surfacing in a post-mortem audit (fail-open, no spend).
      - name: Event coverage check
        if: steps.key.outputs.have_key == 'true' && steps.guard.outputs.serve == 'true'
        run: python3 event_coverage.py || true

      # ESCALATE THE COVERAGE GAP (owner directive 2026-07-31), ported from the crypto
      # desk. event_coverage.py already knew when a marquee event on today's calendar had
      # no story, and said so in a ::warning:: nobody reads. That is how the crypto desk
      # missed the FOMC decision it had itself flagged, and it is the same shape as this
      # desk missing Joshua's KO on a night it covered Spence-Tszyu.
      #
      # STILL NOT A GATE. A coverage gap is a judgment call, so this never blocks a publish
      # and never fails the run.
      #
      # Anti-noise, because this runs several times a day: ONE issue, tracked by a
      # fingerprint of the uncovered set; an identical set on a later run says nothing; a
      # changed set rewrites the body and posts one comment; no gaps closes the issue.
      - name: Flag an uncovered known event
        if: steps.key.outputs.have_key == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PYEOF'
          import hashlib, json, os, urllib.request
          tok, repo = os.environ["GH_TOKEN"], os.environ["REPO"]
          title = "Calendar: a known event has no coverage"
          hdrs = {"Authorization": f"Bearer {tok}", "Accept": "application/vnd.github+json"}

          def api(url, data=None, method=None):
              req = urllib.request.Request(
                  url, data=json.dumps(data).encode() if data is not None else None,
                  headers=hdrs, method=method)
              return json.load(urllib.request.urlopen(req))

          try:
              gaps = json.load(open("out/event_gaps.json", encoding="utf-8"))["uncovered"]
          except Exception as e:
              print(f"no calendar gap report to act on ({e})"); raise SystemExit

          issues = api(f"https://api.github.com/repos/{repo}/issues?state=open&labels=calendar")
          existing = next((i for i in issues if i["title"] == title), None)

          if not gaps:
              if existing:
                  api(existing["comments_url"], {"body": f"Every event now due has coverage. "
                                                         f"Closing. ({os.environ['RUN_URL']})"})
                  api(f"https://api.github.com/repos/{repo}/issues/{existing['number']}",
                      {"state": "closed", "state_reason": "completed"}, method="PATCH")
                  print(f"gap cleared; closed #{existing['number']}")
              else:
                  print("no uncovered events")
              raise SystemExit

          fp = hashlib.sha1("|".join(sorted(
              f"{e.get('date')}::{e.get('title')}" for e in gaps)).encode()).hexdigest()[:12]
          lines = "\n".join(
              f"- **{e.get('date')}** ({e.get('kind')}) {e.get('title')}\n"
              f"  - nothing published matching `{e.get('match')}`\n"
              f"  - source: {e.get('source', 'n/a')}" for e in gaps)
          body = (f"Today's event calendar lists {len(gaps)} event(s) that are due "
                  f"and carry no matching story.\n\n{lines}\n\n"
                  "This is advisory: it does not block publishing, and it is fine to close "
                  "if the desk decided the event was not worth covering. It reopens if a "
                  "different event goes uncovered.\n\n"
                  f"Last checked: {os.environ['RUN_URL']}\n\n<!-- gapfp:" + fp + " -->")

          if not existing:
              api(f"https://api.github.com/repos/{repo}/issues",
                  {"title": title, "body": body, "labels": ["calendar"]}, method="POST")
              print(f"opened a calendar flag for {len(gaps)} event(s)")
          elif f"<!-- gapfp:{fp} -->" in (existing.get("body") or ""):
              # Same events as last run. Say nothing: this fires three times a day and a
              # repeated comment would train everyone to ignore the flag.
              print(f"same {len(gaps)} event(s) already flagged on #{existing['number']}; quiet")
          else:
              api(f"https://api.github.com/repos/{repo}/issues/{existing['number']}",
                  {"body": body}, method="PATCH")
              api(existing["comments_url"],
                  {"body": f"The uncovered set changed:\n\n{lines}\n\n{os.environ['RUN_URL']}"})
              print(f"updated #{existing['number']}: the uncovered set changed")
          PYEOF

      # THE DAILY EDITION (Jack's media-outlet doctrine, 2026-07-14): the guaranteed
      # per-slot synthesis over the desk's own published stories. Runs even when no new
      # story cleared the gates (the whole point: never a zero-content slot). Fail-open
      # for the brief: an edition failure warns loudly but never blocks story publishing.
      - name: The Daily Edition (Morning / Afternoon / Evening Brief + The Bottom Line)
        id: wrap
        if: steps.key.outputs.have_key == 'true' && steps.guard.outputs.serve == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # a breaking run REGENERATES the current slot's edition so The Bottom Line
          # includes the story that just broke (owner directive 2026-07-15)
          BREAKING: ${{ inputs.breaking == true && '1' || '0' }}
          SLOT_CRON: ${{ github.event.schedule }}
          # the slot a recovery fire is FOR (outranks cron and clock in wrap.py)
          SLOT_NAME: ${{ inputs.slot }}
        run: |
          # FAIL-LOUD (owner ruling 2026-08-17, fix 2): the exit code is captured and
          # enforced by the LAST step of the job, after stories publish. An edition
          # failure no longer hides inside a green run, and it still cannot block
          # story publishing. wrap.py exits 0 on publish AND on honest silence.
          rc=0
          python3 wrap.py || rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" != "0" ]; then
            echo "::error::daily edition failed its gates (exit $rc); stories publish normally and the final step will mark this run FAILED"
          fi


      # THE MONITORING BELT, PROPAGATED (owner ruling 2026-08-03, fix 5: gates built on
      # the crypto desk over three weeks never reached this one; two of three desks ran
      # unprotected, the pipeline's signature staged-versus-shipped gap). Both checks are
      # advisory for the RUN and loud for a HUMAN: the edition gap check files one
      # deduplicated flag issue when the guaranteed edition has stopped (the wrap step
      # above is `|| echo`, and a warning inside a green run is a named anti-pattern);
      # the duplicate audit reports the corpus-wide backlog the publish-time guard
      # cannot see.
      - name: Daily edition gap check (is the guaranteed edition actually running?)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        id: edgap
        run: |
          breach=0
          python3 edition_check.py || breach=$?
          echo "breach=$breach" >> "$GITHUB_OUTPUT"

      # KILL-STREAK ALARM (owner ruling 2026-08-03, N=3): three consecutive approver
      # kills on one development with no publish files one digest issue quoting every
      # kill verbatim, so a human can judge legitimate-versus-theater. The writer
      # carries prior objections into the next draft automatically; this is the bell.
      - name: Kill-streak check (is the desk abandoning a development it owns?)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 kill_streak.py || true

      - name: Duplicate audit (cross-day, whole corpus)
        if: always()
        run: python3 dupe_audit.py || true

      - name: Commit and push published content (deploys the site)
        id: publish
        if: steps.key.outputs.have_key == 'true' && steps.guard.outputs.serve == 'true'
        run: |
          git config user.name "Jack Berno"
          git config user.email "297991518+jaybiz0131@users.noreply.github.com"
          # Refresh the committed live-scores snapshot so the fallback never ages badly.
          # Rides this commit; fail-open, never blocks a publish.
          python3 scores_pulse.py || true
          git add site/content editorial-log.json site/data/scores.json
          if git diff --cached --quiet; then
            echo "::notice::No new stories to publish (nothing VERIFIED or all already live)."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "brief: VERIFIED stories $(date -u +%Y-%m-%dT%H:%MZ)"
            # LAST-LINE DUPLICATE SWEEP (2026-08-25). The guards upstream judge the
            # corpus in this run's checkout; this judges the corpus as it exists NOW,
            # after fetching whatever landed while the run worked. A zero-novelty twin
            # of an already-published story is removed from the commit before it ships,
            # loudly. Hygiene never blocks the news: a sweep crash publishes unswept.
            git fetch origin main || true
            python3 publish_sweep.py || echo "::warning::publish_sweep skipped (crashed)"
            if [ -f out/sweep_dropped ]; then
              git add -A site/content
              git commit --amend --no-edit --allow-empty
              rm -f out/sweep_dropped
            fi
            # RACE-SAFE PUSH, ported from the crypto desk after it lost two runs on
            # this exact step. A sibling run can push while this one works (drifted
            # retries land in pairs), the push is rejected, and what happened next used
            # to lose the run's verified stories two different ways.
            ok=false
            for i in 1 2 3; do
              if git push; then ok=true; break; fi
              echo "::warning::push rejected (attempt $i): main moved mid-run; rebasing and retrying"
              # --autostash is load-bearing, not tidiness: plain "git pull --rebase"
              # refuses to run with ANY unstaged change and exits 128, which kills the
              # step under bash -e on the very first rejection.
              #
              # The rebase then conflicts, which the comment this replaces said it would
              # not: site/content/ is per-slug and additive, but editorial-log.json and site/data/scores.json are
              # rewritten by EVERY run, so two overlapping runs always collide there.
              # merge_state.py resolves exactly those and refuses anything else, so a
              # real conflict still fails loudly (fail-closed).
              if ! git pull --rebase --autostash origin main; then
                if python3 merge_state.py; then
                  git add editorial-log.json site/data/scores.json
                  GIT_EDITOR=true git rebase --continue \
                    || { echo "::error::rebase could not continue after auto-resolve"; \
                         git rebase --abort || true; exit 1; }
                else
                  echo "::error::rebase hit a conflict outside the known generated files"
                  git rebase --abort || true
                  exit 1
                fi
              fi
              # a sibling landed mid-run and the rebase just merged it: sweep again
              # against the now-complete corpus before retrying the push
              python3 publish_sweep.py || true
              if [ -f out/sweep_dropped ]; then
                git add -A site/content
                git commit --amend --no-edit --allow-empty
                rm -f out/sweep_dropped
              fi
            done
            [ "$ok" = true ] || { echo "::error::push failed after 3 rebase-and-retry attempts"; exit 1; }
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      # The Publicist moved to its own workflow (publicist.yml, 14:30 UTC) so posts land
      # in LinkedIn's US morning instead of the middle of the night.

      # Deploy-status verification (directive item 10): a pushed commit that never
      # deployed is a story nobody sees. Probes the live CDN for every page this run
      # published; failure opens a flag issue and turns the run red.
      - name: Verify the deploy actually served
        if: steps.publish.outputs.pushed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 deploy_check.py

      # A dead slot must PING, not sit quiet (2026-07-15: two contract failures went
      # unnoticed until the owner asked where the stories were). One open issue per
      # failure title; the watcher's slot recovery independently retries the slot.
      - name: Flag the failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PYEOF'
          import json, os, urllib.request
          tok, repo = os.environ["GH_TOKEN"], os.environ["REPO"]
          title = "Desk run failed: pipeline error (see run log)"
          hdrs = {"Authorization": f"Bearer {tok}", "Accept": "application/vnd.github+json"}
          body = (f"A scheduled/breaking desk run failed: {os.environ['RUN_URL']}\n\n"
                  "The watcher's slot recovery will retry the slot automatically; this flag "
                  "exists so a repeating failure gets human eyes. Close after the next green run.")
          # Self-diagnosing failures: include the run report (error + per-stage status) so
          # nobody needs log access to see what broke.
          try:
              rep = json.load(open("out/run_report.json", encoding="utf-8"))
              stages = "\n".join(
                  f"- {s['stage']}: " + ("ok" if s["ok"] else f"FAILED {s.get('detail', '')}")
                  for s in rep.get("stages", []))
              body += (f"\n\nRun report\nstatus: {rep.get('status')}\n"
                       f"error: `{str(rep.get('error', ''))[:600]}`\n{stages}")
          except Exception as e:
              body += f"\n\n(run report unavailable: {e})"
          req = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/issues?state=open&labels=pipeline", headers=hdrs)
          existing = next((i for i in json.load(urllib.request.urlopen(req))
                           if i["title"] == title), None)
          if existing:
              # Repeat failure: comment the fresh report on the open flag instead of
              # going silent (a dedupe that hides new evidence helps nobody). EXCEPT
              # the API usage-limit error: it repeats identically every slot until the
              # limit resets, and each comment emails the owner; one open flag says it.
              if "specified API usage limits" in body:
                  print("usage-limit failure already flagged; staying quiet until reset")
                  raise SystemExit
              req = urllib.request.Request(existing["comments_url"],
                  data=json.dumps({"body": body}).encode(), headers=hdrs)
              urllib.request.urlopen(req)
              print("flag issue already open; posted the fresh run report as a comment")
              raise SystemExit
          body = (f"A scheduled/breaking desk run failed: {os.environ['RUN_URL']}\n\n"
                  "The watcher's slot recovery will retry the slot automatically; this flag "
                  "exists so a repeating failure gets human eyes. Close after the next green run.")
          req = urllib.request.Request(f"https://api.github.com/repos/{repo}/issues",
              data=json.dumps({"title": title, "body": body, "labels": ["pipeline"]}).encode(),
              headers=hdrs, method="POST")
          urllib.request.urlopen(req); print("failure flag opened")
          PYEOF

      # The other half of the flag. The step above opens one and comments fresh reports on
      # repeats, but nothing ever CLOSED it, so the flag stayed open forever and the next
      # real failure arrived as another comment on a stale issue rather than a new alarm. A
      # green run means the slot recovered, which is the condition the issue body already
      # asks a human to close on.
      - name: Clear the failure flag on a green run
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PYEOF'
          import json, os, urllib.request
          tok, repo = os.environ["GH_TOKEN"], os.environ["REPO"]
          title = "Desk run failed: pipeline error (see run log)"
          hdrs = {"Authorization": f"Bearer {tok}", "Accept": "application/vnd.github+json"}
          req = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/issues?state=open&labels=pipeline", headers=hdrs)
          for i in json.load(urllib.request.urlopen(req)):
              if i["title"] != title:
                  continue
              req = urllib.request.Request(i["comments_url"],
                  data=json.dumps({"body": f"Green run: {os.environ['RUN_URL']}. "
                                           "Closing; the flag re-opens if it fails again."}).encode(),
                  headers=hdrs)
              urllib.request.urlopen(req)
              req = urllib.request.Request(f"https://api.github.com/repos/{repo}/issues/{i['number']}",
                  data=json.dumps({"state": "closed", "state_reason": "completed"}).encode(),
                  headers=hdrs, method="PATCH")
              urllib.request.urlopen(req); print(f"cleared flag #{i['number']}")
          PYEOF

      - name: Upload the review queue for human approval
        if: steps.key.outputs.have_key == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: sports-review-queue
          path: |
            out/items.json
            out/review_queue/
            out/approval_template.json
            out/run_report.json
          if-no-files-found: warn

      # A Netlify rebuild keeps the site fresh (datelines, feed) without committing data.
      # Runs even if the brief failed. SKIPPED when the brief just pushed stories -- that
      # push already triggered a build, and a second one would only burn Netlify build
      # minutes (the free tier pools ~300/month across all sites). No hook secret ->
      # documented skip.
      - name: Refresh the website (Netlify build hook)
        id: ping
        # RETRY GUARD ON THE PING (owner-approved Design 1, 2026-08-17): a retry
        # tick that stood down because its slot was already served must not buy a
        # paid build either. The guard already gates the model calls and the
        # publish; this line closes the last leak. A run that failed before the
        # guard ran (serve empty) also skips the ping.
        if: always() && steps.guard.outputs.serve == 'true'
        env:
          HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
          PUSHED: ${{ steps.publish.outputs.pushed }}
        run: |
          pinged=false
          if [ "$PUSHED" = "true" ]; then
            echo "::notice::Stories were pushed; that deploy already rebuilt the site. Skipping the hook ping."
          elif [ -n "$HOOK" ]; then
            if curl -s -f -X POST -d '{}' "$HOOK" > /dev/null; then
              echo "::notice::Triggered a Netlify rebuild."
              pinged=true
            else
              echo "::warning::Netlify build hook ping failed; the site will refresh on the next deploy."
            fi
          else
            echo "::notice::NETLIFY_BUILD_HOOK not set; the site rebuilds only on pushes. Add the secret to enable the daily refresh."
          fi
          echo "pinged=$pinged" >> "$GITHUB_OUTPUT"

      # OPS LEDGER (owner ruling 2026-08-17, audit fix 5b/5d): one queryable outcome row
      # per brief execution, appended as a comment on the month's "Ops ledger" issue.
      # Answers "how many builds, and why" as a lookup instead of a log dig, and counts
      # watcher-embedded executions (wf field carries the calling workflow's name).
      # Observability only: a ledger failure never fails the run.
      - name: Ops ledger (append this execution's outcome)
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          WF: ${{ github.workflow }}
          EV: ${{ github.event_name }}
          BREAKING: ${{ inputs.breaking == true && '1' || '0' }}
          CRON: ${{ github.event.schedule }}
          SERVE: ${{ steps.guard.outputs.serve }}
          PUSHED: ${{ steps.publish.outputs.pushed }}
          PINGED: ${{ steps.ping.outputs.pinged }}
          RUN_ID: ${{ github.run_id }}
        run: python3 scripts/ops_ledger.py || echo "::warning::ops ledger append failed (observability only, run unaffected)"

      # FAIL-LOUD EDITION GATE (owner-approved Design 2, 2026-08-17): runs dead last
      # so stories, the deploy probe, artifacts, the hook ping, and the ops ledger all
      # complete before the run is failed. If wrap.py exited non-zero, this opens a
      # slot-named issue and marks the run failed. Honest silence (wrap exit 0 without
      # publishing, e.g. the slot is already served) stays green. The ordering is the
      # requirement: story publishing completes even when the edition fails and the
      # run goes red.
      - name: Fail the run if the edition stage failed
        if: always() && steps.wrap.outputs.rc != '' && steps.wrap.outputs.rc != '0'
        uses: actions/github-script@v9
        with:
          script: |
            const now = new Date();
            const h = now.getUTCHours();
            const slot = h < 14 ? "morning" : h < 20 ? "afternoon" : "evening";
            const date = now.toISOString().slice(0, 10);
            const title = `Edition stage failed: ${slot} ${date}`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `wrap.py exited ${{ steps.wrap.outputs.rc }} in this run: ${runUrl}`,
              "",
              "Stories published normally; only the edition stage failed. Slot recovery",
              "re-fires the slot on its own; this issue exists so a repeating edition",
              "failure gets human eyes. Close after the next green slot."
            ].join("\n");
            const { owner, repo } = context.repo;
            const existing = await github.rest.issues.listForRepo({ owner, repo, state: "open", per_page: 100 });
            const open = existing.data.find(i => i.title === title);
            if (open) {
              await github.rest.issues.createComment({ owner, repo, issue_number: open.number, body: `Failed again: ${runUrl}` });
            } else {
              await github.rest.issues.create({ owner, repo, title, body });
            }
            core.setFailed(`Edition stage failed (${slot} ${date}); stories were unaffected.`);

      # EDITION-GAP GATE (owner directive 2026-08-25): an abstained edition is as loud
      # as a failed one. Crypto went dark for 42 hours behind green runs because wrap
      # correctly abstained on zero stories every slot and only the gap counter noticed.
      # Runs dead last so stories, the deploy probe, artifacts, the ping and the ledger
      # all complete first; the gap issue itself is filed by edition_check.
      - name: Fail the run if the edition gap breached
        if: always() && steps.edgap.outputs.breach != '' && steps.edgap.outputs.breach != '0'
        uses: actions/github-script@v9
        with:
          script: |
            core.setFailed("Edition gap over threshold; stories were unaffected. See the open 'Edition gap' issue.");
