# The breaking-news watcher (directive item 2, 2026-07-14): every 30 minutes, NO model
# calls, ~$0. Plain threshold: a fresh story carried by 4+ independent sources (the desk's
# own RSS aggregation) IS the sports definition of breaking news. On trigger it calls the
# full brief workflow with breaking=true, which adds the two-source publish gate.
# Thresholds are configurable without code changes via repo Variables:
#   WATCH_MIN_SOURCES (4), WATCH_FRESH_MIN (90),
#   WATCH_COOLDOWN_MIN (120: quiet while coverage is already fresh).
# The called workflow shares the sports-publish concurrency group, so a breaking run
# QUEUES behind any in-flight scheduled publish: never races it (directive item 9).
name: Breaking-news watcher

# PROGRAM 4, T-1 (2026-09-16). DISABLED ON THIS DESK. The watcher fired a breaking
# run twice an hour, and on 15 Sep it accounted for most of the desk's 30 brief runs:
# a model run and a Netlify build each, for a page whose scores come from the data
# lane, not from the brief. Sports has no equivalent of the Crypto desk's earning
# categories, so it is off rather than caged.
#
# The schedule is commented out, not deleted, so this reverses in a minute (the
# cadence change is reversible under the standing rule). workflow_dispatch stays, so
# the watcher can still be run by hand if a slot needs recovering.
#
# WHAT THIS REMOVES: the :47 tick was the evening slot's 23:45 recovery. That job
# passes to the Worker's Edition dispatch (T-2), which names the slot and so is not
# bound by the UTC edition window a cron would need. Until that Worker deploy lands,
# the evening slot has no automatic backstop; recover it by dispatching this workflow
# or the brief directly with slot="evening-brief".
on:
  schedule:
    # - cron: "17,47 * * * *"   # DISABLED T-1
    - cron: "0 5 31 2 *"       # never fires (31 February); keeps the schedule key valid
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write   # the missed-edition audit opens a flag issue

jobs:
  watch:
    runs-on: ubuntu-latest
    outputs:
      trigger: ${{ steps.w.outputs.trigger }}
      breaking: ${{ steps.w.outputs.breaking }}
      # the edition slug a slot-recovery fire is for; empty on market/news triggers
      slot: ${{ steps.w.outputs.slot }}
      reason: ${{ steps.w.outputs.reason }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - name: Threshold check (no model, no spend)
        id: w
        env:
          WATCH_MIN_SOURCES: ${{ vars.WATCH_MIN_SOURCES }}
          WATCH_FRESH_MIN: ${{ vars.WATCH_FRESH_MIN }}
          WATCH_COOLDOWN_MIN: ${{ vars.WATCH_COOLDOWN_MIN }}
        run: python3 watcher.py

      # A window that closed with no edition is a permanently missed slot the recovery
      # net failed to save. One open issue per title; quiet if already flagged.
      - name: Flag permanently missed editions
        if: steps.w.outputs.missed != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          MISSED: ${{ steps.w.outputs.missed }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PYEOF'
          import json, os, time, urllib.request
          tok, repo = os.environ["GH_TOKEN"], os.environ["REPO"]
          hdrs = {"Authorization": f"Bearer {tok}", "Accept": "application/vnd.github+json"}
          title = "Missed edition: a slot window closed without publishing"

          def call(req):
              # RETRY, THEN STAND DOWN (2026-08-12, run 31637476802): a transient
              # RemoteDisconnected from the API crashed this step and turned an ADVISORY
              # flag into a red watcher run, which is itself a failure report to the
              # owner about nothing. The flag is idempotent by title and this step runs
              # again on the next tick, so after three attempts the right move is a
              # warning, not a failure.
              for i in range(3):
                  try:
                      return json.load(urllib.request.urlopen(req, timeout=30))
                  except Exception as e:
                      last = e
                      time.sleep(2 ** i)
              print(f"::warning::missed-edition flag could not reach the API after 3 "
                    f"attempts ({last}); the next watcher tick retries")
              raise SystemExit(0)

          q = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/issues?state=open&per_page=100",
              headers=hdrs)
          open_titles = {i["title"] for i in call(q)}
          if title in open_titles:
              print("already flagged; staying quiet")
          else:
              body = ("These edition windows closed with no edition file on disk (cron "
                      "drift plus a failed or skipped recovery): " + os.environ["MISSED"]
                      + f"\n\nDetected by the watcher: {os.environ['RUN_URL']}\n"
                      "Close once the gap is understood; a slot cannot be recovered "
                      "after its window ends.")
              data = json.dumps({"title": title, "body": body,
                                 "labels": ["pipeline"]}).encode()
              req = urllib.request.Request(f"https://api.github.com/repos/{repo}/issues",
                                           data=data, headers=hdrs, method="POST")
              call(req)
              print("flag issue opened")
          PYEOF

  # news triggers run with the additive breaking gate; SLOT RECOVERY runs as a normal
  # scheduled-equivalent pipeline (breaking=false)
  fire:
    needs: watch
    if: needs.watch.outputs.trigger == 'true'
    uses: ./.github/workflows/sports-news-brief.yml
    with:
      breaking: ${{ needs.watch.outputs.breaking == 'true' }}
      slot: ${{ needs.watch.outputs.slot }}
    secrets: inherit
    permissions:
      contents: write
      issues: write
